<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1584">
  <title>Charlie Harlow — LinkedIn Banner (1584×396)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 1584px;
      height: 396px;
      overflow: hidden;
      font-family: 'DM Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      background: #F8F5EE;
    }

    /*
      SAFE ZONES (1584 × 396)
      - Desktop: circular profile photo covers bottom-left, roughly x 0–330, y 66–396
      - Mobile: crops left and right, showing the centre ~950px, i.e. x 317–1267
      - Usable intersection for type: x 400–1240, y 50–320
      All copy sits inside that box. The left third holds only the sage wash,
      which is meant to sit behind the profile photo.
    */

    .banner {
      width: 1584px;
      height: 396px;
      position: relative;
      overflow: hidden;
      background: #F8F5EE;
    }

    /* Soft sage wash bleeding in from the left edge only */
    .wash {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(720px 460px at -60px 62%, rgba(125,155,118,0.42) 0%, rgba(125,155,118,0.20) 38%, rgba(125,155,118,0.00) 72%),
        radial-gradient(420px 320px at 120px 18%, rgba(184,204,173,0.34) 0%, rgba(184,204,173,0.00) 70%);
      pointer-events: none;
    }

    /* Content block, right aligned, inside the safe box */
    .content {
      position: absolute;
      left: 400px;
      right: 344px;       /* right edge lands at x = 1240 */
      top: 50px;
      text-align: right;
    }

    .url {
      font-size: 13px;
      font-weight: 500;
      color: #7D9B76;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      margin-bottom: 26px;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 400;
      font-size: 68px;
      line-height: 1.06;
      color: #1C1C1C;
      letter-spacing: -0.005em;
      margin-bottom: 24px;
    }

    h1 em {
      font-style: italic;
      font-weight: 500;
      color: #7D9B76;
    }

    .sub {
      font-family: 'DM Sans', sans-serif;
      font-size: 17px;
      font-weight: 300;
      line-height: 1.55;
      color: #1C1C1C;
      margin-left: auto;
      max-width: 520px;
    }
  </style>
</head>
<body>
  <div class="banner">
    <div class="wash"></div>

    <div class="content">
      <p class="url">charlieharlow.co.uk</p>
      <h1>I build <em>creator campaigns</em><br><em>and programmes</em>.</h1>
      <p class="sub">I set measurement up from the start, and brief creators<br>with both creative freedom and clear strategic direction.</p>
    </div>
  </div>
</body>
</html>
