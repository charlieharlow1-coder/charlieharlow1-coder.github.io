<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1584">
  <title>Charlie Harlow — LinkedIn Banner (1584×396)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 1584px;
      height: 396px;
      overflow: hidden;
      font-family: 'DM Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .banner {
      width: 1584px;
      height: 396px;
      position: relative;
      overflow: hidden;
      background: radial-gradient(ellipse at 70% 40%, #EFE6D2 0%, #F8F5EE 55%);
    }

    /*
      SAFE ZONE GUIDE:
      - Desktop: profile pic covers bottom-left ~330x330px area
      - Mobile: shows CENTER ~950px, crops left + right edges, profile pic bottom-left
      - SAFE BOX: x=500–1400, y=0–240 (top-center-right, above profile pic overlap)
      All critical content sits within this safe box.
    */

    /* Purely decorative — left zone, safe to be covered on desktop */
    .deco-left {
      position: absolute;
      left: -40px;
      top: 50%;
      transform: translateY(-50%);
      width: 380px;
      height: 380px;
      border-radius: 50%;
      background: rgba(125, 155, 118, 0.07);
      pointer-events: none;
    }

    /* Thin sage vertical line — marks transition from deco to content */
    .divider {
      position: absolute;
      left: 500px;
      top: 48px;
      bottom: 48px;
      width: 1px;
      background: rgba(125, 155, 118, 0.25);
    }

    /* Main content — inside safe zone (x=540+, top half of banner) */
    .content {
      position: absolute;
      left: 540px;
      right: 100px;
      top: 0;
      height: 280px; /* keep above profile-pic overlap zone */
      display: flex;
      align-items: center;
      gap: 80px;
    }

    .main { flex: 1; }

    .label {
      font-size: 11px;
      font-weight: 600;
      color: #7D9B76;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      margin-bottom: 16px;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 92px;
      font-weight: 500;
      line-height: 0.92;
      color: #1C1C1C;
      margin-bottom: 22px;
      letter-spacing: -0.01em;
    }

    .tagline {
      font-size: 14px;
      color: #7A7A7A;
      font-style: italic;
      line-height: 1.65;
      max-width: 460px;
      border-left: 2px solid #7D9B76;
      padding-left: 16px;
    }

    /* Skills — right column */
    .skills {
      width: 280px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 0;
      padding-top: 8px;
    }

    .skill {
      padding: 10px 0;
      border-bottom: 1px solid rgba(184, 204, 173, 0.45);
      font-size: 12px;
      color: #5A5A5A;
      letter-spacing: 0.03em;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .skill:last-child { border-bottom: none; }

    .skill::before {
      content: '';
      width: 12px;
      height: 1px;
      background: #7D9B76;
      flex-shrink: 0;
    }

    /* URL — bottom right, inside safe zone */
    .url {
      position: absolute;
      bottom: 28px;
      right: 100px;
      font-size: 11px;
      color: #C2D4BC;
      letter-spacing: 0.1em;
    }

  </style>
</head>
<body>
  <div class="banner">

    <!-- Left decorative (covered by profile pic on desktop — intentional) -->
    <div class="deco-left"></div>
    <div class="divider"></div>

    <!-- Safe zone content -->
    <div class="content">
      <div class="main">
        <p class="label">Marketing Strategist</p>
        <h1>Charlie<br>Harlow</h1>
        <p class="tagline">Creator &amp; creative strategy — building<br>campaigns that resonate culturally<br>and perform commercially.</p>
      </div>
      <div class="skills">
        <div class="skill">Creator &amp; Influencer Strategy</div>
        <div class="skill">Campaign &amp; Creative Strategy</div>
        <div class="skill">Paid Social — TikTok &amp; Meta</div>
        <div class="skill">UGC Programme Management</div>
        <div class="skill">Performance Reporting</div>
      </div>
    </div>

    <p class="url">charlieharlow.co.uk</p>

  </div>
</body>
</html>
