<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1584">
  <title>Charlie Harlow — LinkedIn Banner (1584×396)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 1584px;
      height: 396px;
      overflow: hidden;
      background: #F8F5EE;
      font-family: 'DM Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .banner {
      width: 1584px;
      height: 396px;
      position: relative;
      overflow: hidden;
      /* Warm gradient matching portfolio hero */
      background: radial-gradient(ellipse at 80% 50%, #F0E8D5 0%, #F8F5EE 60%);
    }

    /* Left side — purely decorative, safe to be covered by profile pic */
    .deco-circle-1 {
      position: absolute;
      left: -60px;
      top: 50%;
      transform: translateY(-50%);
      width: 340px;
      height: 340px;
      border-radius: 50%;
      background: rgba(125, 155, 118, 0.08);
    }

    .deco-circle-2 {
      position: absolute;
      left: 80px;
      bottom: -80px;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: rgba(125, 155, 118, 0.06);
    }

    /* Sage accent line — vertical, separating left deco from right content */
    .divider {
      position: absolute;
      left: 420px;
      top: 60px;
      bottom: 60px;
      width: 1px;
      background: rgba(125, 155, 118, 0.3);
    }

    /* Right content — safe zone, well away from profile pic */
    .content {
      position: absolute;
      left: 460px;
      right: 80px;
      top: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      gap: 80px;
    }

    .main {
      flex: 1;
    }

    .label {
      font-size: 11px;
      font-weight: 600;
      color: #7D9B76;
      text-transform: uppercase;
      letter-spacing: 0.25em;
      margin-bottom: 14px;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 88px;
      font-weight: 500;
      line-height: 0.95;
      color: #1C1C1C;
      margin-bottom: 20px;
      letter-spacing: -0.01em;
    }

    .tagline {
      font-size: 15px;
      color: #7A7A7A;
      font-style: italic;
      line-height: 1.6;
      max-width: 480px;
      border-left: 2px solid #7D9B76;
      padding-left: 16px;
    }

    /* Skills column on right */
    .skills {
      width: 300px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    .skill {
      padding: 11px 0;
      border-bottom: 1px solid rgba(184, 204, 173, 0.5);
      font-size: 12px;
      font-weight: 400;
      color: #5A5A5A;
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .skill:last-child { border-bottom: none; }

    .skill::before {
      content: '';
      display: inline-block;
      width: 14px;
      height: 1px;
      background: #7D9B76;
      flex-shrink: 0;
    }

    /* Website URL bottom right */
    .url {
      position: absolute;
      bottom: 24px;
      right: 80px;
      font-size: 11px;
      color: #B8CCAD;
      letter-spacing: 0.1em;
      font-weight: 400;
    }

  </style>
</head>
<body>
  <div class="banner">

    <!-- Left decorative elements (safe to be covered by profile pic) -->
    <div class="deco-circle-1"></div>
    <div class="deco-circle-2"></div>
    <div class="divider"></div>

    <!-- Right content (safe zone) -->
    <div class="content">
      <div class="main">
        <p class="label">Marketing Strategist</p>
        <h1>Charlie<br>Harlow</h1>
        <p class="tagline">Creator &amp; creative strategy — building campaigns<br>that resonate culturally and perform commercially.</p>
      </div>
      <div class="skills">
        <div class="skill">Creator &amp; Influencer Strategy</div>
        <div class="skill">Campaign &amp; Creative Strategy</div>
        <div class="skill">Paid Social — TikTok &amp; Meta</div>
        <div class="skill">UGC Programme Management</div>
        <div class="skill">Performance Reporting</div>
      </div>
    </div>

    <p class="url">charlieharlow.co.uk</p>

  </div>
</body>
</html>
